# 发送视频经本插件转换为base64格式后再发送，适合云崽与机器人不在同一网络环境下开启
sendbase64: false

# 本地视频发送方式，可选值：file / base64 / url。会同步兼容 sendbase64。
videoSendMode: file

# 视频上传拦截，开启后会根据解析的视频文件大小判断是否需要上传
usefilelimit: true

# 视频拦截阈值（填数字），视频文件大于该数值则直接放弃上传，单位: MB，「视频上传拦截」开启后才会生效
#
# 为什么是 1536（即 1.5GB）：这里只是「插件自己愿意放行多大」的闸门，不代表 QQ 一定收得下。
# 能不能真发出去取决于走哪条通道：
#   - 消息内嵌视频段（usegroupfile 关闭时走这条）：ICQQ / OneBot v11（Lagrange、NapCat 等）
#     实测约 100MB 见顶，QQBot 官方接口更低（约 75MB），1.5GB 在这条路上必然失败；
#   - 群文件通道（usegroupfile 开启、且体积超过 groupfilevalue 时走这条）：才扛得住 GB 级文件，
#     1.5GB 只有这条路有希望。
# 所以想真用满 1536，必须把下面的 usegroupfile 打开，并让 groupfilevalue 保持在 100 左右，
# 好让大文件被分流去群文件，而不是硬塞进消息段里。
#
# 这个值还兼职抖音的码率挑选上限（douyin.ts 的 douyinProcessVideos）：在不超过该值的视频源里
# 挑体积最大的那个，且这一用途不受 usefilelimit 开关影响。调到 1536 等于抖音永远取最高码率源。
filelimit: 1536

# 压缩视频，开启后会将视频文件压缩后再上传，适合上传大文件
compress: false

# 触发视频压缩的阈值，单位：MB。当文件大小超过该值时，才会压缩视频，「压缩视频」开启后才会生效
# 没有跟着 filelimit 一起提到 1536 是故意的：这个值同时被当成压缩目标体积用
# （Base.ts 里 calculateBitrate(compresstrigger, 时长) * 0.75 算目标码率），提上去等于关掉压缩，
# 大文件会原样进入发送流程。要放大「允许多大」请改 filelimit，别动这里。
compresstrigger: 100

# 压缩后的值，若视频文件大小大于「触发视频压缩的阈值」的值，则会进行压缩至该值（±5%），「压缩视频」开启后才会生效
compressvalue: 50

# 使用文件上传，开启后会将视频文件上传到群文件中，私聊也行
# 想发超过 100MB 的视频（filelimit 已放开到 1536）必须打开这个开关：消息内嵌视频段扛不住，
# 只有群文件通道能过 GB 级文件。保持 false 的话，100MB 以上的视频会走消息段并发送失败。
usegroupfile: false

# 群文件上传阈值，当文件大小超过该值时将使用群文件上传，单位：MB，「使用群文件上传」开启后才会生效
# 维持 100 是故意的，别跟着 filelimit 提到 1536：这个值是「多大才改走群文件」的分流线，
# 提上去会让 1.5GB 的文件继续走消息段，结果必然发送失败。100 正好贴着 ICQQ / OneBot v11
# 消息内嵌视频约 100MB 的实测上限。
groupfilevalue: 100

# 网络图片发送方式，可选值：url / file / base64
imageSendMode: url

# 多线程下载开关，开启后对支持 Range 的大文件使用分片并发下载
downloadMultiThread: false

# 多线程下载并发数，建议 2-8，数值过高可能触发服务器限流
downloadConcurrency: 4

# 下载限速开关，开启后会限制下载速度，避免触发服务器风控导致连接被重置
downloadThrottle: false

# 下载速度限制，单位：MB/s，仅在 downloadThrottle 开启后生效
downloadMaxSpeed: 10

# 断流自动降速，检测到连接被重置时自动降低下载速度
downloadAutoReduce: true

# 最低下载速度，单位：MB/s，自动降速不会低于此值
downloadMinSpeed: 1
