# 发送视频经本插件转换为base64格式后再发送，适合云崽与机器人不在同一网络环境下开启
sendbase64: false

# 本地视频发送方式，可选值：file / base64 / url。会同步兼容 sendbase64。
videoSendMode: file

# 视频上传拦截，开启后会根据解析的视频文件大小判断是否需要上传
usefilelimit: true

# 视频拦截阈值（填数字），视频文件大于该数值则直接放弃上传，单位: MB，「视频上传拦截」开启后才会生效
#
# 为什么是 1536（即 1.5GB）：这里只是「插件自己愿意放行多大」的闸门，不代表 QQ 一定收得下。
# 能不能真发出去取决于走哪条通道：
#   - 消息内嵌视频段（usegroupfile 关闭时走这条）：ICQQ / OneBot v11（Lagrange、NapCat 等）
#     实测约 100MB 见顶，QQBot 官方接口更低（约 75MB），1.5GB 在这条路上必然失败；
#   - 群文件通道（usegroupfile 开启、且体积超过 groupfilevalue 时走这条）：才扛得住 GB 级文件，
#     1.5GB 只有这条路有希望。
# 所以想真用满 1536，必须把下面的 usegroupfile 打开，并让 groupfilevalue 保持在 100 左右，
# 好让大文件被分流去群文件，而不是硬塞进消息段里。
#
# 这个值还兼职抖音的码率挑选上限（douyin.ts 的 douyinProcessVideos）：在不超过该值的视频源里
# 挑体积最大的那个，且这一用途不受 usefilelimit 开关影响。调到 1536 等于抖音永远取最高码率源。
filelimit: 1536

# 压缩视频，开启后会将视频文件压缩后再上传，适合上传大文件
compress: false

# 触发视频压缩的阈值，单位：MB。当文件大小超过该值时，才会压缩视频，「压缩视频」开启后才会生效
# 没有跟着 filelimit 一起提到 1536 是故意的：这个值同时被当成压缩目标体积用
# （Base.ts 里 calculateBitrate(compresstrigger, 时长) * 0.75 算目标码率），提上去等于关掉压缩，
# 大文件会原样进入发送流程。要放大「允许多大」请改 filelimit，别动这里。
compresstrigger: 100

# 压缩后的值，若视频文件大小大于「触发视频压缩的阈值」的值，则会进行压缩至该值（±5%），「压缩视频」开启后才会生效
compressvalue: 50

# 使用文件上传，开启后会将视频文件上传到群文件中，私聊也行
# 想发超过 100MB 的视频（filelimit 已放开到 1536）必须打开这个开关：消息内嵌视频段扛不住，
# 只有群文件通道能过 GB 级文件。保持 false 的话，100MB 以上的视频会走消息段并发送失败。
usegroupfile: false

# 群文件上传阈值，当文件大小超过该值时将使用群文件上传，单位：MB，「使用群文件上传」开启后才会生效
# 维持 100 是故意的，别跟着 filelimit 提到 1536：这个值是「多大才改走群文件」的分流线，
# 提上去会让 1.5GB 的文件继续走消息段，结果必然发送失败。100 正好贴着 ICQQ / OneBot v11
# 消息内嵌视频约 100MB 的实测上限。
groupfilevalue: 100

# 网络图片发送方式，可选值：url / file / base64
imageSendMode: url

# 多线程下载开关，开启后对支持 Range 的大文件使用分片并发下载
downloadMultiThread: false

# 下载连接预算，范围 2-16，默认 8。
#
# 这个值不是「一个文件切成几片」，而是「同一个平台同时最多开几条下载连接」——
# 文件级下载和多线程分片共享同一份额度。限流是按 IP + 平台触发的，两级各管一层的话
# 实际并发是乘积（解析并发 × 文件并发 × 分片数），一个 30 图的实况图集瞬间就能开出
# 几十条连接，平台直接把 IP 限掉。
#
# 分桶的单位是平台（douyin / bilibili / kuaishou / xiaohongshu），不是域名：抖音光
# 硬编码的域名就有五个，真正下大文件的 CDN 域名还是接口动态返回的，按域名分桶等于
# 把上限悄悄放宽好几倍。不同平台之间互不影响。
#
# 旧版本这里的 4 是「单文件分片数」。语义换成平台连接总数后 4 反而比原来更紧
# （原来单个文件自己就能开 4 条），所以默认值抬到 8。从旧版本升级上来的配置会保留
# 你已经填的数值，不会被这次默认值变更覆盖。
downloadConcurrency: 8

# 下载限速开关，开启后会限制下载速度，避免触发服务器风控导致连接被重置
downloadThrottle: false

# 下载速度限制，单位：MB/s，仅在 downloadThrottle 开启后生效
downloadMaxSpeed: 10

# 断流自动降速，检测到连接被重置时自动降低下载速度
downloadAutoReduce: true

# 最低下载速度，单位：MB/s，自动降速不会低于此值
downloadMinSpeed: 1

# 低速重启开关，开启后持续低速的下载会被掐掉重来，并换一个 CDN 地址
#
# 治的是「一直在动、但慢得没有意义」那种下载：B站 偶尔会把连接限在 0.1 MB/s，
# 32MB 的分离流要下五分半。原有的看守判的是「完全断流超过 30 秒」，限速时数据一直在来，
# 那个看守永远不会响，所以需要这一条单独盯速率。
downloadSlowRestart: true

# 低速判定下限，单位：KB/s。连续低于该速度就判定为被限速
#
# 默认 256KB/s 的取法：它比任何一种「正常但偏慢」的家宽都低（2Mbps 上行也有 250KB/s），
# 又远高于观测到的限速值（0.1MB/s ≈ 102KB/s）。填 0 等于关掉低速判定。
downloadSlowFloor: 256

# 低速持续多久才动手，单位：秒
#
# 不做成即判即断是因为一次采样撞上对端的短暂停顿就重启，是把抖动当故障。
# 20 秒在 0.1 MB/s 下只下了 2MB，此时重启还来得及。
downloadSlowSustain: 20

# 外部下载器，可选值：off / auto / curl / wget
#
# off   仅用内置的 axios 流式下载（默认）
# auto  探测系统里有没有 curl / wget，有就用第一个可用的（优先 curl），没有就回落内置
# curl / wget  指名要用哪个；系统里没装时回落内置，不会报错
#
# 什么时候值得开：外部工具在弱网和长连接上比 Node 的 http 栈稳（自带重试、断点续传、
# 连接复用），curl 还能靠 --speed-limit 自己处理限速重连。代价是多一个进程、
# 进度只能靠轮询目标文件体积拿到，而且它们不参与本插件除下载连接预算以外的任何流控。
#
# auto 优先 curl 是因为只有它有 --speed-limit：低速判定在它自己的 C 代码里做，不占 Node
# 的事件循环。wget 没有等价物，选它时低速判定由本插件轮询文件体积自己盯，效果一样，
# 只是多一点开销。
#
# 两个工具都是跨平台的：Windows 10 1803 以后自带 curl.exe；wget 需要自己装。
# 探测结果会缓存到进程结束，所以装了新工具要重启才认。
downloadExternalTool: off

# 外部下载器的体积门槛，单位：MB。小于该体积的文件仍走内置下载
#
# 外部工具的好处（断点续传、自带重试）只在长时间下载里才划得来，小文件上
# 多 spawn 一个进程、还要靠轮询文件体积拿进度，是净亏。
downloadExternalMinSize: 64
