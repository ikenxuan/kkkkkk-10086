name: 🗑️ 自动关闭不活跃 Issue 和 PR

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - name: 🧠 标记并关闭不活跃 Issue/PR
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          stale-issue-message: 这个 Issue 已经超过 30 天没有活动，将被标记为 stale。请回复以保持打开状态。
          stale-pr-message: 这个 PR 已经超过 30 天没有活动，将被标记为 stale。请回复以保持打开状态。
          days-before-close: 7
          close-issue-message: 由于长时间没有活动，此 Issue 已被自动关闭。
          close-pr-message: 由于长时间没有活动，此 PR 已被自动关闭。
