name: 🚀 发布并推送到 master

on:
  workflow_dispatch:
  push:
    branches:
      # 仅监听 dev：master 仍由旧的 release-please.yml（v3、release-type: node）负责，
      # 两者同时监听 master 会各自开出版本方案不同的发布 PR。
      - dev

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # workflow_dispatch 在 Actions 界面里默认选中仓库默认分支（本仓库是 master）。
    # 不加这个判断的话，手点一次「Run workflow」就会用 v4 manifest 语义对 master 开发布 PR，
    # 和 master 自己那份 v3 release-please.yml 正面撞车——正是上面注释要避免的情况。
    if: github.ref_name == 'dev'

    steps:
      - name: 🧪 触发 release-please 发布检查
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 写死 dev，不用 github.ref_name：这个工作流只负责 dev 这条线。
          target-branch: dev
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: 📥 检出插件代码
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 配置 pnpm
        if: ${{ steps.release.outputs.release_created }}
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: ⚙️ 设置 Node.js 环境
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 📦 安装依赖
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm install --frozen-lockfile

      - name: 🛠️ 构建并验证插件
        if: ${{ steps.release.outputs.release_created }}
        env:
          # 这个工作流跑在 dev 上，产物推到 master。必须显式告诉构建产物「你属于 master」，
          # 否则 build-metadata 会烘进 GITHUB_REF_NAME（dev），压缩包安装的用户在稳定版上
          # 看到的发布通道会是 Dev（release-channel.ts 的 CHANNEL_BY_BRANCH 里 master 映射为 Stable）。
          KKK_PUBLISH_BRANCH: master
        run: pnpm verify

      - name: 📁 准备发布文件
        if: ${{ steps.release.outputs.release_created }}
        shell: bash
        run: |
          node <<'NODE'
          const { cpSync, existsSync, mkdirSync, readFileSync, rmSync, writeFileSync } = require('node:fs')
          const { join, resolve } = require('node:path')

          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'))
          const publishDir = resolve('temp_lib_content')
          rmSync(publishDir, { recursive: true, force: true })
          mkdirSync(publishDir, { recursive: true })

          for (const relativePath of packageJson.files ?? []) {
            const source = resolve(relativePath)
            if (!existsSync(source)) {
              throw new Error(`Required release file does not exist: ${relativePath}`)
            }
            const destination = join(publishDir, relativePath)
            mkdirSync(resolve(destination, '..'), { recursive: true })
            cpSync(source, destination, { recursive: true })
            console.log(`[copy] ${relativePath}`)
          }

          writeFileSync(join(publishDir, '.gitignore'), 'node_modules/\n')
          console.log(`[ready] ${publishDir}`)
          NODE

      - name: 🧹 移除开发依赖
        if: ${{ steps.release.outputs.release_created }}
        working-directory: temp_lib_content
        run: pnpm pkg delete devDependencies

      # keep_files: true 是必需的，不是偷懒。
      #
      # master 是默认分支，`.github/workflows/issue_*.yml` 和 `.github/ISSUE_TEMPLATE/`
      # 都得留在它上面：issues / schedule 事件的工作流和 issue 表单都是从**默认分支的副本**
      # 读取的，删掉就等于关掉那几个 issue 机器人和两个 issue 模板。
      #
      # 而默认的 keep_files: false 是全量替换分支内容，推送里就会包含对
      # .github/workflows 的删除 —— GITHUB_TOKEN 没有 workflows 权限，增删改 workflow
      # 文件一律被拒（refusing to allow a GitHub App to create or update workflow file）。
      # 而 release-please 是先打 tag 发 Release 再走到这一步，被拒就会留下一个
      # 没有可安装分支的 Release。
      #
      # 所以：不删任何东西 -> 推送不含 workflow 文件 -> GITHUB_TOKEN 就够，不需要 PAT。
      # 代价是以后从 files 里去掉的文件会残留在 master 上，需要时手动清一次。
      - name: 📤 推送到 master 分支
        if: ${{ steps.release.outputs.release_created }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: temp_lib_content
          force_orphan: false
          keep_files: true
          # 必须显式清空。这个 action 的 exclude_assets 默认值是 '.github'，
          # 它在把产物拷进目标分支之后单独 rm 掉目标分支里的 .github，
          # 和 keep_files 是两条独立逻辑 —— v2.37.0 那次发布日志里
          # `[INFO] Keep existing files` 正常打出来了，master 上的 6 个
          # issue 工作流与 issue 模板照样被这条默认规则删掉（已在 24568d0 恢复）。
          exclude_assets: ''
          # 提交信息不再直接搬 dev 那条 squash 信息。
          #
          # 原来是 `github.event.head_commit.message`，而这一步只在 release_created
          # 时执行 —— 那一刻 dev 的 head 永远是 release-please 那条「chore(dev):
          # release X.Y.Z (#N)」。它描述的是「版本号 PR 被合并」，不是「这条提交里
          # 装的是什么」。于是在 master 上翻历史时，看不出这是构建产物、对应哪个 tag、
          # 由哪个源提交构建出来 —— 而 master 上除了产物什么都没有，提交信息是唯一线索。
          #
          # 用 YAML 块标量直接写多行，不走 $GITHUB_ENV 的 heredoc：后者一旦正文里
          # 出现和分隔符同名的一行就能越界写环境变量。这里每个字段都来自
          # release-please 的输出或 github 上下文，没有一处是能被提交信息 / PR 标题
          # 影响的自由文本，所以块标量是安全的。
          #
          # 刻意不塞 changelog 正文（steps.release.outputs.body）：那是由提交信息
          # 拼出来的自由文本，长度几十行且内容不可控；它已经随产物里的 CHANGELOG.md
          # 和 GitHub Release 页一起发出去了，没必要在提交信息里再抄一份。
          full_commit_message: |
            chore(release): ${{ steps.release.outputs.tag_name }} 构建产物

            版本: ${{ steps.release.outputs.version }}
            源提交: ${{ github.sha }}
            通道: Stable（构建时 KKK_PUBLISH_BRANCH=master）
            Release: ${{ steps.release.outputs.html_url }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
