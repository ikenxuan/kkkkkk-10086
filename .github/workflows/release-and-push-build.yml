name: 🚀 发布并推送发布分支

on:
  workflow_dispatch:
  push:
    branches:
      # 仅监听 dev：master 仍由旧的 release-please.yml（v3、release-type: node）负责，
      # 两者同时监听 master 会各自开出版本方案不同的发布 PR。
      - dev

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # workflow_dispatch 在 Actions 界面里默认选中仓库默认分支（本仓库是 master）。
    # 不加这个判断的话，手点一次「Run workflow」就会用 v4 manifest 语义对 master 开发布 PR，
    # 和 master 自己那份 v3 release-please.yml 正面撞车——正是上面注释要避免的情况。
    if: github.ref_name == 'dev'

    steps:
      - name: 🧪 触发 release-please 发布检查
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 写死 dev，不用 github.ref_name：这个工作流只负责 dev 这条线。
          target-branch: dev
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: 📥 检出插件代码
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 📦 配置 pnpm
        if: ${{ steps.release.outputs.release_created }}
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: ⚙️ 设置 Node.js 环境
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: 📦 安装依赖
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm install --frozen-lockfile

      - name: 🛠️ 构建并验证插件
        if: ${{ steps.release.outputs.release_created }}
        env:
          # 这个工作流跑在 dev 上，产物推到 release。必须显式告诉构建产物「你属于 release」，
          # 否则 build-metadata 会烘进 GITHUB_REF_NAME（dev），压缩包安装的用户在稳定版上
          # 看到的发布通道会是 Dev。
          KKK_PUBLISH_BRANCH: release
        run: pnpm verify

      - name: 📁 准备发布文件
        if: ${{ steps.release.outputs.release_created }}
        shell: bash
        run: |
          node <<'NODE'
          const { cpSync, existsSync, mkdirSync, readFileSync, rmSync, writeFileSync } = require('node:fs')
          const { join, resolve } = require('node:path')

          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'))
          const publishDir = resolve('temp_lib_content')
          rmSync(publishDir, { recursive: true, force: true })
          mkdirSync(publishDir, { recursive: true })

          for (const relativePath of packageJson.files ?? []) {
            const source = resolve(relativePath)
            if (!existsSync(source)) {
              throw new Error(`Required release file does not exist: ${relativePath}`)
            }
            const destination = join(publishDir, relativePath)
            mkdirSync(resolve(destination, '..'), { recursive: true })
            cpSync(source, destination, { recursive: true })
            console.log(`[copy] ${relativePath}`)
          }

          writeFileSync(join(publishDir, '.gitignore'), 'node_modules/\n')
          console.log(`[ready] ${publishDir}`)
          NODE

      - name: 🧹 移除开发依赖
        if: ${{ steps.release.outputs.release_created }}
        working-directory: temp_lib_content
        run: pnpm pkg delete devDependencies

      - name: 📤 推送到 release 分支
        if: ${{ steps.release.outputs.release_created }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: temp_lib_content
          force_orphan: false
          full_commit_message: ${{ github.event.head_commit.message || format('Release build {0}', github.sha) }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
